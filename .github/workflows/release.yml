name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify release artifacts without publishing
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release -warnaserror
      - run: dotnet test tests/DevX.Tests/DevX.Tests.csproj -c Release
      - run: dotnet format --verify-no-changes

  pack:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack src/DevX.Cli -c Release -o artifacts/nupkg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error

  binaries:
    needs: test
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            runner: macos-latest
            archive: tar.gz
          - rid: osx-x64
            runner: macos-latest
            archive: tar.gz
          - rid: linux-x64
            runner: ubuntu-latest
            archive: tar.gz
          - rid: win-x64
            runner: windows-latest
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Determine release version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "value=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          fi
      - run: dotnet publish src/DevX.Cli -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -o publish/${{ matrix.rid }}
      - name: Smoke test published binary
        shell: bash
        env:
          PY: ${{ runner.os == 'Windows' && 'python' || 'python3' }}
          RID: ${{ matrix.rid }}
        # osx-x64 runs on the arm64 macOS runner through Rosetta.
        run: ${PY} tools/smoke_single_file.py "publish/${RID}"
      - name: Archive binary (Unix)
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RID: ${{ matrix.rid }}
        run: tar -czf "devx-${VERSION}-${RID}.tar.gz" -C "publish/${RID}" .
      - name: Archive binary (Windows)
        if: ${{ matrix.archive == 'zip' }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          RID: ${{ matrix.rid }}
        run: 7z a "devx-${VERSION}-${RID}.zip" "publish/${RID}/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.rid }}
          path: devx-${{ steps.version.outputs.value }}-${{ matrix.rid }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: [pack, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Flatten release artifacts
        shell: bash
        run: mkdir release && find artifacts -type f -exec cp {} release/ \;
      - name: Create checksums
        shell: bash
        run: |
          cd release && shasum -a 256 -- * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt .
      - name: Publish draft GitHub Release
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: gh release create "$REF_NAME" --draft --generate-notes release/*
      - name: Push NuGet package
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push release/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Dry run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: echo "Dry run complete. Would create a draft GitHub Release and push the NuGet package."
