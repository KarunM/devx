name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include command and output; remove secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevX version
    validations:
      required: true
